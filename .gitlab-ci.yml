image: node:20

stages:
  - install
  - lint
  - typecheck
  - test
  - build

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  before_script:
    - npm ci --cache .npm --prefer-offline

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.run_optional_script:
  script:
    - |
      if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts[process.env.NPM_SCRIPT] ? 0 : 1)"; then
        npm run "$NPM_SCRIPT"
      else
        echo "Skipping missing script: $NPM_SCRIPT"
      fi

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  variables:
    NPM_SCRIPT: lint
  extends: .run_optional_script

typecheck:
  stage: typecheck
  variables:
    NPM_SCRIPT: type-check
  extends: .run_optional_script

test:
  stage: test
  variables:
    NPM_SCRIPT: test
  extends: .run_optional_script

build:
  stage: build
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
      - web-build/
      - .expo/
