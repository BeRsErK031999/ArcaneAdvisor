image: node:20

stages:
  - install
  - image
  - lint
  - typecheck
  - test
  - build

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
  before_script:
    - npm ci --cache .npm --prefer-offline

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.run_optional_script:
  script:
    - |
      if node -e "const scripts=require('./package.json').scripts||{}; process.exit(scripts[process.env.NPM_SCRIPT] ? 0 : 1)"; then
        npm run "$NPM_SCRIPT"
      else
        echo "Skipping missing script: $NPM_SCRIPT"
      fi

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline

build_static_image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script: []
  cache: []
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile.static" --destination "$CI_REGISTRY_IMAGE/static:$CI_COMMIT_SHORT_SHA" --destination "$CI_REGISTRY_IMAGE/static:$CI_COMMIT_REF_SLUG"
    - echo "Static files path inside image: /static"
  rules:
    - if: $CI_COMMIT_BRANCH

lint:
  stage: lint
  variables:
    NPM_SCRIPT: lint
  extends: .run_optional_script

typecheck:
  stage: typecheck
  variables:
    NPM_SCRIPT: type-check
  extends: .run_optional_script

test:
  stage: test
  variables:
    NPM_SCRIPT: test
  extends: .run_optional_script

build:
  stage: build
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - dist/
      - web-build/
      - .expo/
